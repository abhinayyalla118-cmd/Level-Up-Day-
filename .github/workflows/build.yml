name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find Project and Build APK
      run: |
        # Search for gradlew file in all subdirectories
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)

        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in $DIR. Building..."
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          # If no gradlew wrapper, search for build.gradle
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            DIR=$(dirname "$BUILD_FILE")
            echo "Found build.gradle in $DIR"
            cd "$DIR"
            gradle assembleDebug
          else
            echo "No Android project found!"
            exit 1
          fi
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
